<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script>
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 412), H = +(P.get('h') || 915), theme = P.get('theme') || 'light'
const routes = ['', 'index/nifty50', 'index/ftse100', 'index/nikkei225', 'index/eurostoxx50', 'companies', 'company/TCS', 'company/TCS/trend', 'company/TCS/peers', 'company/TCS/calculations', 'company/TCS/sources', 'company/TSCO', 'company/TSE-6758', 'company/EU-ADS.DE', 'company/BRITANNIA', 'compare/countries', 'compare/sectors', 'compare/map', 'method', 'nope']
const out = []
const parse = (c) => { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(',').map(Number); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 } }
const lum = ({ r, g, b }) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b) }
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05) }
function bgOf(el, w) { let e = el; while (e) { const c = parse(w.getComputedStyle(e).backgroundColor); if (c && c.a > 0.5) return c; e = e.parentElement } return { r: 255, g: 255, b: 255 } }
function check(route, f) {
  const d = f.contentDocument, w = f.contentWindow, R = { route }
  R.title = d.title
  R.hOverflow = d.documentElement.scrollWidth - d.documentElement.clientWidth
  const vis = (e) => { const r = e.getBoundingClientRect(); const cs = w.getComputedStyle(e); return r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none' }
  const els = [...d.querySelectorAll('a[href], button, input, select, summary, [role=option], [tabindex]:not([tabindex="-1"])')].filter(vis)
  const box = els.map((e) => { const r = e.getBoundingClientRect(); return { n: (e.getAttribute('aria-label') || e.textContent || e.getAttribute('placeholder') || e.tagName).replace(/\s+/g, ' ').trim().slice(0, 28), w: Math.round(r.width), h: Math.round(r.height) } })
  R.targets = box.length
  R.under24 = box.filter((b) => b.w < 24 || b.h < 24)
  R.under44 = box.filter((b) => b.w < 44 || b.h < 44).length
  R.under48 = box.filter((b) => b.w < 48 || b.h < 48).length
  R.noName = els.filter((e) => !((e.getAttribute('aria-label') || '').trim() || e.textContent.trim() || e.getAttribute('title') || e.getAttribute('placeholder'))).map((e) => e.outerHTML.slice(0, 90))
  R.h1 = d.querySelectorAll('h1').length
  const hs = [...d.querySelectorAll('h1,h2,h3,h4')].map((h) => +h.tagName[1]); R.headingSkips = hs.filter((v, i) => i > 0 && v - hs[i - 1] > 1).length
  const texts = [...d.querySelectorAll('body *')].filter((e) => vis(e) && [...e.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim()))
  const fails = []; let small = 0
  for (const e of texts) {
    const cs = w.getComputedStyle(e); const fs = parseFloat(cs.fontSize); const fw = +cs.fontWeight || 400
    if (fs < 12) small++
    const fg = parse(cs.color); if (!fg) continue
    const cr = ratio(fg, bgOf(e, w)); const large = fs >= 24 || (fs >= 18.66 && fw >= 700)
    if (cr < (large ? 3 : 4.5)) fails.push({ t: e.textContent.replace(/\s+/g, ' ').trim().slice(0, 24), cr: Math.round(cr * 100) / 100, fs, cls: String(e.className).slice(0, 24), color: cs.color })
  }
  R.text = texts.length; R.textUnder12 = small; R.contrastFails = fails.length
  const byColor = {}; for (const x of fails) { const k = x.color + ' ' + x.cr; byColor[k] = byColor[k] || { n: 0, ex: x.t, cls: x.cls, fs: x.fs }; byColor[k].n++ }
  R.contrastByColor = byColor
  R.skipLink = !!d.querySelector('a[href^="#main"], .skip-link')
  R.liveRegion = !!d.querySelector('[aria-live]')
  return R
}
async function run() {
  for (const r of routes) {
    await new Promise((done) => {
      const f = document.createElement('iframe'); f.style.width = W + 'px'; f.style.height = H + 'px'
      f.src = `/?theme=${theme}#/${r}`; document.body.appendChild(f)
      f.onload = () => setTimeout(() => { try { out.push(check(r, f)) } catch (e) { out.push({ route: r, error: String(e) }) } f.remove(); done() }, 2500)
    })
  }
  document.getElementById('out').textContent = JSON.stringify(out)
}
run()
</script></body></html>
