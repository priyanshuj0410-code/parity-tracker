name: Design checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  design-checks:
    name: design-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrast and token checks
        run: python3 knowledge/contrast.py
